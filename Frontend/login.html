<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pennywise — Login</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <!-- Illustration Side -->
    <div class="auth-illustration-side">
      <img src="/assets/images/wallet-illustration.svg" alt="Pennywise Wallet Illustration" width="360" height="315">
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/assets/icons/logo.svg" alt="Pennywise Logo" width="26" height="26">
        <span>Pennywise</span>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Welcome back!</h1>
        <p class="auth-subtitle">Log in to your account to continue managing your finances.</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-icon-group">
            <span class="icon-left">
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </span>
            <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-icon-group">
            <span class="icon-left">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </span>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <span class="icon-right" id="toggleLoginPasswordBtn" title="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </span>
          </div>
        </div>

        <div class="auth-form-options">
          <label class="checkbox-label" for="loginRememberMe">
            <input type="checkbox" id="loginRememberMe" checked>
            <span>Remember Me</span>
          </label>
          <a href="#" class="forgot-link" onclick="alert('Password reset is not available yet. Please contact your administrator.')">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-auth" id="loginSubmitBtn">Login</button>

        <div class="auth-switch">
          Don't have an account? <a href="/register.html">Sign Up</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script>
    Auth.redirectIfAuth();

    // Toggle password visibility
    const passInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('toggleLoginPasswordBtn');
    toggleBtn?.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      toggleBtn.style.color = isPass ? 'var(--primary-green)' : 'var(--muted-accent)';
    });

    // Handle Login Submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('loginRememberMe').checked;

      if (!email) return Utils.showToast('Email address is required', 'error');
      if (!password) return Utils.showToast('Password is required', 'error');

      const submitBtn = document.getElementById('loginSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const res = await Auth.login(email, password, rememberMe);
        if (res.success) {
          Utils.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 400);
        }
      } catch (err) {
        Utils.showToast(err.message || 'Invalid email or password', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
