<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pennywise — Create Account</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <!-- Illustration Side -->
    <div class="auth-illustration-side">
      <img src="/assets/images/wallet-illustration.svg" alt="Pennywise Wallet Illustration" width="360" height="315">
    </div>

    <!-- Registration Card -->
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/assets/icons/logo.svg" alt="Pennywise Logo" width="26" height="26">
        <span>Pennywise</span>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Start your financial journey today.</p>
      </div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="regFullName">Full Name</label>
          <div class="input-icon-group">
            <span class="icon-left">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </span>
            <input type="text" id="regFullName" class="form-control" placeholder="John Doe" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <div class="input-icon-group">
            <span class="icon-left">
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </span>
            <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <div class="input-icon-group">
            <span class="icon-left">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </span>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <span class="icon-right" id="togglePasswordBtn" title="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password</label>
          <div class="input-icon-group">
            <span class="icon-left">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </span>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
            <span class="icon-right" id="toggleConfirmPasswordBtn" title="Toggle confirm password visibility">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </span>
          </div>
        </div>

        <div class="auth-form-options">
          <label class="checkbox-label" for="regAgreeTerms">
            <input type="checkbox" id="regAgreeTerms">
            <span>I agree to the <a href="#" style="color:var(--primary-green); text-decoration:underline;" onclick="alert('Pennywise Terms: Your financial data is securely kept in your private SQLite database.')">Terms & Conditions</a></span>
          </label>
        </div>

        <button type="submit" class="btn btn-auth" id="regSubmitBtn">Create Account</button>

        <div class="auth-switch">
          Already have an account? <a href="/login.html">Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script>
    Auth.redirectIfAuth();

    // Toggle password visibility
    const togglePass = (inputEl, btnEl) => {
      btnEl.addEventListener('click', () => {
        const isPass = inputEl.type === 'password';
        inputEl.type = isPass ? 'text' : 'password';
        btnEl.style.color = isPass ? 'var(--primary-green)' : 'var(--muted-accent)';
      });
    };
    togglePass(document.getElementById('regPassword'), document.getElementById('togglePasswordBtn'));
    togglePass(document.getElementById('regConfirmPassword'), document.getElementById('toggleConfirmPasswordBtn'));

    // Handle Registration Submission
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const agree = document.getElementById('regAgreeTerms').checked;

      if (!fullName) return Utils.showToast('Full name is required', 'error');
      if (!email) return Utils.showToast('Email address is required', 'error');
      if (!password || password.length < 6) return Utils.showToast('Password must be at least 6 characters', 'error');
      if (password !== confirmPassword) return Utils.showToast('Passwords do not match', 'error');
      if (!agree) return Utils.showToast('You must agree to the Terms & Conditions', 'error');

      const submitBtn = document.getElementById('regSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const res = await Auth.register(fullName, email, password, confirmPassword, agree);
        if (res.success) {
          Utils.showToast('Account created successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 600);
        }
      } catch (err) {
        Utils.showToast(err.message || 'Registration failed', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
