<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pennywise — Savings Goals</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/savings-goals.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebarContainer" class="app-sidebar"></aside>

    <div class="app-main">
      <header id="headerContainer" class="app-header"></header>

      <main class="app-content">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1 class="page-title">Savings Goals</h1>
            <p class="page-subtitle">Save for what matters most.</p>
          </div>
          <button class="btn btn-primary btn-pill" id="openAddGoalBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>+ Add Goal</span>
          </button>
        </div>

        <!-- 4 Top Metric Cards -->
        <div class="stat-cards-grid">
          <div class="stat-card">
            <div class="stat-icon green">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Goals</span>
              <span class="stat-value" id="goalsCountVal">0</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon blue">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Target Amount</span>
              <span class="stat-value" id="goalsTargetVal">0 EGP</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon purple">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.83 7.5l-2.27-2.27c.07-.42.18-.81.33-1.15.22-.52.28-1.04.14-1.52-.15-.49-.5-.87-1.01-1.09-.4-.17-.85-.18-1.3-.04-.52.17-.98.54-1.34 1.05-.77 1.08-1.59 2.59-1.92 3.52H9.54C9.21 6.09 8.39 4.58 7.62 3.5c-.36-.51-.82-.88-1.34-1.05-.45-.14-.9-.13-1.3.04-.51.22-.86.6-1.01 1.09-.14.48-.08 1 .14 1.52.15.34.26.73.33 1.15L2.17 7.5C1.43 8.24 1 9.27 1 10.36v7.28C1 19.5 2.5 21 4.36 21h15.28C21.5 21 23 19.5 23 17.64v-7.28c0-1.09-.43-2.12-1.17-2.86zM12 18c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Saved</span>
              <span class="stat-value" id="goalsSavedVal">0 EGP</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon red">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Remaining Amount</span>
              <span class="stat-value" id="goalsRemainingVal">0 EGP</span>
            </div>
          </div>
        </div>

        <!-- Goals Cards Grid -->
        <div class="goals-grid" id="goalsGrid"></div>
      </main>
    </div>
  </div>

  <!-- Create/Edit Goal Modal -->
  <div class="modal-backdrop" id="goalModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="goalModalTitle">Add Savings Goal</h3>
        <button class="modal-close" id="closeGoalModalBtn">&times;</button>
      </div>
      <form id="goalForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="goalModalName">Goal Name</label>
            <input type="text" id="goalModalName" class="form-control" placeholder="e.g. Vacation or New Laptop" required>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="goalModalTarget">Target Amount</label>
              <input type="number" step="0.01" id="goalModalTarget" class="form-control" placeholder="e.g. 30000" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="goalModalCurrent">Current Saved Amount</label>
              <input type="number" step="0.01" id="goalModalCurrent" class="form-control" placeholder="0">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="goalModalDate">Target Date (Optional)</label>
            <input type="date" id="goalModalDate" class="form-control">
          </div>

          <div class="form-group">
            <label class="form-label" for="goalModalDesc">Description (Optional)</label>
            <textarea id="goalModalDesc" class="form-control" rows="2" placeholder="Notes about this savings goal..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelGoalModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveGoalBtn">Save Goal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Savings / Withdrawal Modal -->
  <div class="modal-backdrop" id="savingsActionModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="savingsActionModalTitle">Add Savings</h3>
        <button class="modal-close" id="closeSavingsActionModalBtn">&times;</button>
      </div>
      <form id="savingsActionForm">
        <input type="hidden" id="savingsActionType" value="deposit">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="savingsActionAmount">Amount</label>
            <input type="number" step="0.01" id="savingsActionAmount" class="form-control" placeholder="0.00" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="savingsActionDate">Date</label>
            <input type="date" id="savingsActionDate" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="savingsActionNotes">Notes (Optional)</label>
            <input type="text" id="savingsActionNotes" class="form-control" placeholder="e.g. Deposit from bonus">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelSavingsActionModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="savingsActionSubmitBtn">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/savings-goals.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SavingsGoals.init();
    });
  </script>
</body>
</html>
