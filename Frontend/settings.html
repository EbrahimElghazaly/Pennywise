<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pennywise — Profile & Settings</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebarContainer" class="app-sidebar"></aside>

    <div class="app-main">
      <header id="headerContainer" class="app-header"></header>

      <main class="app-content">
        <!-- Settings Tabs -->
        <div class="settings-tabs">
          <button class="settings-tab-btn active" id="tabProfileBtn">Profile</button>
          <button class="settings-tab-btn" id="tabPasswordBtn">Change Password</button>
          <button class="settings-tab-btn" id="tabPreferencesBtn">Preferences</button>
        </div>

        <!-- Tab 1: Profile -->
        <div id="sectionProfile">
          <div class="settings-layout">
            <!-- Left Profile Summary Card -->
            <div class="settings-card profile-summary">
              <div class="profile-avatar-large" id="profileAvatarLarge">AM</div>
              <h2 class="profile-name" id="profileDisplayName">Ahmed Mohamed</h2>
              <p class="profile-email" id="profileDisplayEmail">ahmed@example.com</p>
              <div class="profile-joined" id="profileJoinedDate">Account Created: Oct 1, 2026</div>
              <button class="btn btn-secondary btn-sm" onclick="document.getElementById('profileFullNameInput').focus()">
                Edit Profile
              </button>
            </div>

            <!-- Right Profile Form -->
            <div class="settings-card">
              <h3 class="card-title">Personal Information</h3>
              <form id="profileForm">
                <div class="form-group">
                  <label class="form-label" for="profileFullNameInput">Full Name</label>
                  <input type="text" id="profileFullNameInput" class="form-control" required>
                </div>

                <div class="form-group">
                  <label class="form-label" for="profileEmailInput">Email Address</label>
                  <input type="email" id="profileEmailInput" class="form-control" required>
                </div>

                <div class="form-group">
                  <label class="form-label" for="profilePhoneInput">Phone Number</label>
                  <input type="tel" id="profilePhoneInput" class="form-control" placeholder="+20 123 456 789">
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Save Changes</button>
              </form>
            </div>
          </div>
        </div>

        <!-- Tab 2: Change Password -->
        <div id="sectionPassword" style="display:none;">
          <div class="settings-card" style="max-width: 560px;">
            <h3 class="card-title">Update Your Password</h3>
            <p style="font-size:0.875rem; color:var(--text-secondary); margin-bottom:1.5rem;">
              Ensure your account is using a long, random password to stay secure.
            </p>

            <form id="passwordForm">
              <div class="form-group">
                <label class="form-label" for="currentPasswordInput">Current Password</label>
                <input type="password" id="currentPasswordInput" class="form-control" required autocomplete="current-password">
              </div>

              <div class="form-group">
                <label class="form-label" for="newPasswordInput">New Password</label>
                <input type="password" id="newPasswordInput" class="form-control" required minlength="6" autocomplete="new-password">
              </div>

              <div class="form-group">
                <label class="form-label" for="confirmPasswordInput">Confirm New Password</label>
                <input type="password" id="confirmPasswordInput" class="form-control" required minlength="6" autocomplete="new-password">
              </div>

              <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Update Password</button>
            </form>
          </div>
        </div>

        <!-- Tab 3: Preferences -->
        <div id="sectionPreferences" style="display:none;">
          <div class="settings-card" style="max-width: 560px;">
            <h3 class="card-title">Settings & Preferences</h3>

            <form id="preferencesForm">
              <div class="form-group">
                <label class="form-label" for="prefCurrencySelect">Display Currency</label>
                <select id="prefCurrencySelect" class="form-control">
                  <option value="EGP">Egyptian Pound (EGP)</option>
                  <option value="USD">US Dollar (USD)</option>
                  <option value="EUR">Euro (EUR)</option>
                  <option value="GBP">British Pound (GBP)</option>
                  <option value="SAR">Saudi Riyal (SAR)</option>
                  <option value="AED">UAE Dirham (AED)</option>
                </select>
                <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:0.35rem;">
                  All calculations and formatting throughout the app will automatically reflect this currency.
                </div>
              </div>

              <div class="form-group" style="margin-top:1.5rem;">
                <label class="form-label">Interface Theme</label>
                <div class="theme-toggle-group">
                  <button type="button" class="theme-btn active" id="themeLightBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
                    <span>Light</span>
                  </button>
                  <button type="button" class="theme-btn" id="themeDarkBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
                    <span>Dark</span>
                  </button>
                </div>
              </div>

              <div style="margin-top:2rem; display:flex; justify-content:space-between; align-items:center;">
                <button type="submit" class="btn btn-primary">Save Preferences</button>
                <button type="button" class="btn btn-secondary" id="settingsLogoutBtn" style="color:var(--danger); border-color:var(--danger);">
                  Logout
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Settings.init();
    });
  </script>
</body>
</html>
