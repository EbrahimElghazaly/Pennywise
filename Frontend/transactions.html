<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pennywise — Transactions</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/transactions.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside id="sidebarContainer" class="app-sidebar"></aside>

    <div class="app-main">
      <header id="headerContainer" class="app-header"></header>

      <main class="app-content">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1 class="page-title">Transactions</h1>
            <p class="page-subtitle">Manage your income and expenses in one place.</p>
          </div>
          <button class="btn btn-primary btn-pill" id="openAddTxBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span>+ Add Transaction</span>
          </button>
        </div>

        <!-- 3 Summary Stat Cards -->
        <div class="stat-cards-grid" style="grid-template-columns: repeat(3, 1fr);">
          <div class="stat-card">
            <div class="stat-icon green">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Income</span>
              <span class="stat-value" id="txTotalIncome">0 EGP</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon red">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Expenses</span>
              <span class="stat-value" id="txTotalExpenses">0 EGP</span>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon blue">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Net Cash Flow</span>
              <span class="stat-value" id="txNetCashFlow">0 EGP</span>
            </div>
          </div>
        </div>

        <!-- Filter Toolbar -->
        <div class="filter-toolbar">
          <div class="filter-group">
            <div class="filter-search">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              <input type="text" id="txSearchInput" class="form-control" placeholder="Search transactions...">
            </div>

            <select id="txTypeFilter" class="filter-select">
              <option value="all">All Types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>

            <select id="txCategoryFilter" class="filter-select">
              <option value="all">All Categories</option>
            </select>

            <select id="txMonthFilter" class="filter-select">
              <option value="this_month" selected>This Month</option>
              <option value="last_month">Last Month</option>
              <option value="all">All Time</option>
            </select>
          </div>
        </div>

        <!-- Transactions Table Card -->
        <div class="transactions-table-card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Title</th>
                  <th>Type</th>
                  <th>Category</th>
                  <th style="text-align:right;">Amount</th>
                  <th style="text-align:center;">Actions</th>
                </tr>
              </thead>
              <tbody id="txTableBody"></tbody>
            </table>
          </div>

          <!-- Pagination Footer -->
          <div class="pagination-container">
            <div id="txCountInfo">Showing 0-0 of 0 transactions</div>
            <div class="pagination-pages" id="txPagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Transaction Modal -->
  <div class="modal-backdrop" id="txModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="txModalTitle">Add Transaction</h3>
        <button class="modal-close" id="closeTxModalBtn">&times;</button>
      </div>
      <form id="txForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="txModalTitleInput">Title</label>
            <input type="text" id="txModalTitleInput" class="form-control" placeholder="e.g. Grocery Shopping" required>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="txModalAmount">Amount</label>
              <input type="number" step="0.01" id="txModalAmount" class="form-control" placeholder="0.00" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="txModalType">Type</label>
              <select id="txModalType" class="form-control">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="txModalCategory">Category</label>
              <select id="txModalCategory" class="form-control" required></select>
            </div>

            <div class="form-group">
              <label class="form-label" for="txModalDate">Date</label>
              <input type="date" id="txModalDate" class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="txModalNotes">Notes (Optional)</label>
            <textarea id="txModalNotes" class="form-control" rows="2" placeholder="Add additional details..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelTxModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveTxBtn">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/transactions.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Transactions.init();
    });
  </script>
</body>
</html>
